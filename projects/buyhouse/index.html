// ── NZ PAYE Calculator (2024/25) ──────────────────────────────────────────────
function calcPAYE(gross) {
  const brackets = [
    { limit: 14000, rate: 0.105 },
    { limit: 48000, rate: 0.175 },
    { limit: 70000, rate: 0.30 },
    { limit: 180000, rate: 0.33 },
    { limit: Infinity, rate: 0.39 },
  ];
  let tax = 0, prev = 0;
  for (const b of brackets) {
    if (gross <= prev) break;
    const taxable = Math.min(gross, b.limit) - prev;
    tax += taxable * b.rate;
    prev = b.limit;
  }
  return tax;
}

// ── ESCT Rate (approximate for employer KiwiSaver) ────────────────────────────
function esctRate(gross) {
  if (gross <= 16800) return 0.105;
  if (gross <= 57600) return 0.175;
  if (gross <= 84000) return 0.30;
  if (gross <= 216000) return 0.33;
  return 0.39;
}

  const [councilRates, setCouncilRates] = useState(3000);
  const [buildingInsurance, setBuildingInsurance] = useState(2200);
  const [contentsInsurance, setContentsInsurance] = useState(600);
  const [waterRates, setWaterRates] = useState(900);
  const [maintenance, setMaintenance] = useState(7500);
  const [majorRepair, setMajorRepair] = useState(3000);
  const [bodyCorp, setBodyCorp] = useState(0);

  // ── Market ────────────────────────────────────────────────────────────────
  const [appreciation, setAppreciation] = useState(5);
  const [investReturn, setInvestReturn] = useState(7);
  const [analyzeYears, setAnalyzeYears] = useState(20);

  // ─────────────────────────────────────────────────────────────────────────
  // COMPUTED: Income & Tax
  // ─────────────────────────────────────────────────────────────────────────
  const income = useMemo(() => {
    const combined = grossSalary + partnerSalary;
    const paye = calcPAYE(grossSalary) + calcPAYE(partnerSalary);
    const acc = Math.min(grossSalary, ACC_CAP) * ACC_RATE + Math.min(partnerSalary, ACC_CAP) * ACC_RATE;
    // 本人 KiwiSaver（仅按本人收入计算）
    const kiwiEmp = grossSalary * kiwiRate / 100;
    const empKiwiGross = grossSalary * employerMatchRate / 100;
    const esct = empKiwiGross * esctRate(grossSalary);
    const kiwiEmpr = empKiwiGross - esct;
    const govtMTC = Math.min(kiwiEmp, 1042.86) * 0.5;

    // 伴侣 KiwiSaver（按伴侣收入计算，可与本人合并用于首套房提取）
    const partnerKiwiEmp = partnerSalary * partnerKiwiRate / 100;
    const partnerEmpKiwiGross = partnerSalary * employerMatchRate / 100;
    const partnerEsct = partnerEmpKiwiGross * esctRate(partnerSalary);
    const partnerKiwiEmpr = partnerEmpKiwiGross - partnerEsct;
    const partnerGovtMTC = Math.min(partnerKiwiEmp, 1042.86) * 0.5;

    const annualTakeHome = combined - paye - acc - kiwiEmp;
    const monthlyTakeHome = annualTakeHome / 12;
    const weeklyTakeHome = annualTakeHome / 52;
    const monthlyDisposable = monthlyTakeHome - remittanceToChina;  // 扣除汇款到中国后的可支配收入

    const stressRate = mortgageRate + 2;
    const loan = housePrice * (1 - downPct / 100);
    const rMonthly = mortgageRate / 100 / 12;
    const rStress = stressRate / 100 / 12;
    const nMonths = loanYears * 12;
    const monthlyMortgage = loan > 0 ? loan * rMonthly * Math.pow(1 + rMonthly, nMonths) / (Math.pow(1 + rMonthly, nMonths) - 1) : 0;
    const stressMortgage = loan > 0 ? loan * rStress * Math.pow(1 + rStress, nMonths) / (Math.pow(1 + rStress, nMonths) - 1) : 0;

    const annualRecurring = councilRates + buildingInsurance + contentsInsurance + waterRates + maintenance + majorRepair + bodyCorp;
    const totalBuyMonthly = monthlyMortgage + annualRecurring / 12;
    const rentMonthly = weeklyRent * 52 / 12;

    // ── 买房后出租房间（boards / flatmates）── 租金收入 + 房贷利息抵扣 ──
    const TOTAL_BEDROOMS = 3;                          // 假设 3 卧住宅，按房间数比例分摊可抵扣费用
    const roomRentalWeekly = roomsRented * roomWeeklyRent;
    const roomRentalMonthly = roomRentalWeekly * 52 / 12;
    const roomRentalAnnual = roomRentalWeekly * 52;
    const annualInterest = loan * (mortgageRate / 100);    // 首年房贷利息近似（用于出租比例分摊）
    const rentalApportion = roomsRented / TOTAL_BEDROOMS;
    const deductibleInterest = annualInterest * rentalApportion;
    // 出租净应纳税收入（租金 − 可抵扣房贷利息），再按边际税率算税负
    const netRentalTaxable = Math.max(0, roomRentalAnnual - deductibleInterest);
    const rentalTaxExtra = calcPAYE(combined + netRentalTaxable) - calcPAYE(combined);
    const rentalTaxMonthly = rentalTaxExtra / 12;
    const totalBuyMonthlyNet = totalBuyMonthly - roomRentalMonthly + rentalTaxMonthly;

    const mortgageToIncome = monthlyMortgage / monthlyTakeHome * 100;
    const totalBuyToIncome = totalBuyMonthly / monthlyTakeHome * 100;
    const totalBuyToIncomeNet = totalBuyMonthlyNet / monthlyTakeHome * 100;
    const rentToIncome = rentMonthly / monthlyTakeHome * 100;
    const dti = loan / combined;
    const stressMortgageToIncome = stressMortgage / monthlyTakeHome * 100;

    const annualKiwi = kiwiEmp + kiwiEmpr + govtMTC + partnerKiwiEmp + partnerKiwiEmpr + partnerGovtMTC;

    // 分别投影本人与伴侣 KiwiSaver（基金回报与购房年限共用）
    let userProjected = kiwiBalance;
    let partnerProjected = partnerKiwiBalance;
    for (let y = 0; y < purchaseYearsAway; y++) {
      userProjected = userProjected * (1 + kiwiFundReturn / 100) + (kiwiEmp + kiwiEmpr + govtMTC);
      partnerProjected = partnerProjected * (1 + kiwiFundReturn / 100) + (partnerKiwiEmp + partnerKiwiEmpr + partnerGovtMTC);
    }
    const kiwiProjected = userProjected + partnerProjected;
    const kiwiWithdrawable = Math.max(0, userProjected - 1000) + Math.max(0, partnerProjected - 1000);

    const effectiveDeposit = housePrice * downPct / 100;
    const kiwiCoversDeposit = (kiwiWithdrawable / effectiveDeposit * 100);

    return {
      paye, acc, kiwiEmp, kiwiEmpr, govtMTC, esct,
      partnerKiwiEmp, partnerKiwiEmpr, partnerGovtMTC,
      annualTakeHome, monthlyTakeHome, weeklyTakeHome,
      monthlyMortgage, stressMortgage, stressRate,
      annualRecurring, totalBuyMonthly, totalBuyMonthlyNet, totalBuyToIncomeNet, rentMonthly,
      mortgageToIncome, totalBuyToIncome, rentToIncome, dti, stressMortgageToIncome,
      roomRentalMonthly, roomRentalAnnual, rentalApportion, deductibleInterest, rentalTaxMonthly,
      kiwiProjected, kiwiWithdrawable, kiwiCoversDeposit, annualKiwi, combined, monthlyDisposable, remittanceToChina,
      userProjected, partnerProjected,
    };
  }, [grossSalary, partnerSalary, kiwiRate, kiwiBalance, partnerKiwiRate, partnerKiwiBalance, partnerKiwiYears, employerMatchRate, kiwiYears, kiwiFundReturn,
      mortgageRate, loanYears, housePrice, downPct, weeklyRent, purchaseYearsAway,
      roomsRented, roomWeeklyRent,
      councilRates, buildingInsurance, contentsInsurance, waterRates, maintenance, majorRepair, bodyCorp,
      remittanceToChina, salaryIncrease, salaryCap]);

  // KiwiSaver chart data
  const kiwiChartData = useMemo(() => {
    const data = [];
    let bal = kiwiBalance + partnerKiwiBalance;
    for (let y = 0; y <= Math.max(analyzeYears, purchaseYearsAway + 1); y++) {
      data.push({ year: y, balance: Math.round(bal), withdrawable: Math.round(Math.max(0, bal - 2000)) });
      bal = bal * (1 + kiwiFundReturn / 100) + income.annualKiwi;
    }
    return data;
  }, [kiwiBalance, partnerKiwiBalance, kiwiFundReturn, income.annualKiwi, analyzeYears, purchaseYearsAway]);

  // Wealth comparison chart
  const down = housePrice * downPct / 100;
  const oneTimeCosts = lawyerFee + limReport + buildingInspection + valuation + mortgageEstab + titleReg + movingCosts + renovation;
  const loanAmt = housePrice - down;
  const r = mortgageRate / 100 / 12;
  const n = loanYears * 12;

  const { chartData, breakEven, finalBuy, finalRent } = useMemo(() => {
    let remainingLoan = loanAmt;
    let propValue = housePrice;
    let rentWealth = down + oneTimeCosts;
    let breakEven = null;
    const annualRecurring = councilRates + buildingInsurance + contentsInsurance + waterRates + maintenance + majorRepair + bodyCorp;
    const buyMonthly = income.monthlyMortgage + annualRecurring / 12 - income.roomRentalMonthly + income.rentalTaxMonthly;
    const rentMonthlyVal = income.rentMonthly;
    const surplus = buyMonthly - rentMonthlyVal;

    const data = [];
    for (let y = 0; y <= analyzeYears; y++) {
      const buyNW = propValue - remainingLoan;
      const rentNW = rentWealth;
      if (y > 0 && !breakEven && buyNW >= rentNW) breakEven = y;
      data.push({ year: y, buying: Math.round(buyNW), renting: Math.round(rentNW), propValue: Math.round(propValue) });
      for (let m = 0; m < 12; m++) {
        const interest = remainingLoan * r;
        remainingLoan = Math.max(0, remainingLoan - (income.monthlyMortgage - interest));
      }
      propValue *= (1 + appreciation / 100);
      rentWealth = rentWealth * (1 + investReturn / 100) + (surplus > 0 ? surplus * 12 * (1 + investReturn / 100 / 2) : surplus * 12);
    }
    const finalBuyVal = data[analyzeYears] && data[analyzeYears].buying !== undefined ? data[analyzeYears].buying : 0;
    const finalRentVal = data[analyzeYears] && data[analyzeYears].renting !== undefined ? data[analyzeYears].renting : 0;
    return { chartData: data, breakEven, finalBuy: finalBuyVal, finalRent: finalRentVal };
  }, [loanAmt, housePrice, down, oneTimeCosts, councilRates, buildingInsurance, contentsInsurance, waterRates, maintenance, majorRepair, bodyCorp, income, r, appreciation, investReturn, analyzeYears]);

  const winner = finalBuy > finalRent ? "buy" : "rent";
  const bankPass = income.dti <= 6 && income.stressMortgageToIncome <= 45;

  return (
    <div style={{ maxWidth: 980, margin: "0 auto" }}>

      {/* ── Header ── */}
      <div style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 10, color: COLORS.green, letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 4 }}>新西兰 · 综合财务决策</div>
          <h1 style={{ fontSize: 24, fontWeight: 800, color: "#f8fafc", letterSpacing: "-0.02em" }}>租房 vs 买房 · 全成本 + 收入分析</h1>
        </div>
        <div style={{ display: "flex", gap: 20 }}>
          {[
            { l: "税后月收入", v: fmtFull(income.monthlyTakeHome), c: COLORS.green },
            { l: "月供", v: fmtFull(income.monthlyMortgage), c: COLORS.amber },
            { l: "银行资格", v: bankPass ? "✅ 通过" : "❌ 不通过", c: bankPass ? COLORS.green : COLORS.red },
          ].map(s => (
            <div key={s.l} style={{ textAlign: "right" }}>
              <div style={{ fontSize: 10, color: "#475669", textTransform: "uppercase" }}>{s.l}</div>
              <div style={{ fontSize: 14, fontWeight: 800, color: s.c, fontFamily: "'DM Mono',monospace" }}>{s.v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Tabs ── */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 3, padding: 4, background: "#111827", borderRadius: 10 }}>
          {[["income","💼 收入 & KiwiSaver"],["onetime","💰 一次性费用"],["annual","📅 年度费用"],["params","⚙️ 市场参数"],["results","📊 对比结果"]].map(([id,label]) => (
            <TabBtn key={id} active={tab===id} onClick={()=>setTab(id)}>{label}</TabBtn>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>
          <button onClick={() => fileInputRef.current.click()} style={{ padding: "7px 14px", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 600, background: "#1e293b", color: "#94a3b8", border: "1px solid #334155", transition: "all 0.15s" }} onMouseEnter={e => e.target.style.background = "#334155"} onMouseLeave={e => e.target.style.background = "#1e293b"}>📂 导入参数</button>
          <button onClick={exportParams} style={{ padding: "7px 14px", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 600, background: "#064e3b", color: COLORS.green, border: "1px solid #065f46", transition: "all 0.15s" }} onMouseEnter={e => e.target.style.background = "#065f46"} onMouseLeave={e => e.target.style.background = "#064e3b"}>💾 导出参数</button>
          <button onClick={resetToDefaults} style={{ padding: "7px 14px", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 600, background: "#7f1d1d", color: COLORS.red, border: "1px solid #991b1b", transition: "all 0.15s" }} onMouseEnter={e => e.target.style.background = "#991b1b"} onMouseLeave={e => e.target.style.background = "#7f1d1d"}>🔄 重置默认</button>
          <input ref={fileInputRef} type="file" accept=".json" onChange={importParams} style={{ display: "none" }} />
        </div>
      </div>

      {/* ════════════════════════════════════════════════════════════════ */}
      {/* INCOME TAB                                                       */}
      {/* ════════════════════════════════════════════════════════════════ */}
      {tab === "income" && (<Fragment>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={panelStyle}>
              <div style={{ fontSize: 11, color: COLORS.green, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 14 }}>💼 薪资设置</div>

              <div style={labelStyle}>① 本人薪资</div>
              <SliderRow label="本人年薪（税前）" value={grossSalary} min={30000} max={200000} step={1000} unit="$" onChange={setGrossSalary} note={`每年涨 $${salaryIncrease.toLocaleString()} 至上限 $${salaryCap.toLocaleString()}`} color={COLORS.green} />
              <SliderRow label="每年涨薪" value={salaryIncrease} min={0} max={10000} step={500} unit="$" onChange={setSalaryIncrease} note="教师薪资等级自动增长" color={COLORS.cyan} />
              <SliderRow label="薪资上限" value={salaryCap} min={50000} max={200000} step={1000} unit="$" onChange={setSalaryCap} note="PCT1–PCT2 上限" color={COLORS.cyan} />

              <div style={labelStyle}>② 本人 KiwiSaver</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                {[3,4,6,8,10].map(v => (
                  <button key={v} onClick={() => setKiwiRate(v)} style={{
                    flex: 1, padding: "7px 0", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700,
                    background: kiwiRate === v ? COLORS.purple : "#1e293b",
                    color: kiwiRate === v ? "#0f172a" : "#64748b",
                    border: `1px solid ${kiwiRate === v ? COLORS.purple : "#334155"}`,
                  }}>{v}%</button>
                ))}
              </div>
              <div style={{ fontSize: 11, color: "#475669", marginBottom: 12 }}>本人员工缴纳比例</div>
              <SliderRow label="KiwiSaver 现有余额" value={kiwiBalance} min={0} max={200000} step={500} unit="$" onChange={setKiwiBalance} color={COLORS.purple} />
              <SliderRow label="KiwiSaver 已加入年数" value={kiwiYears} min={0} max={30} step={1} unit="年" onChange={setKiwiYears} note={`${kiwiYears + purchaseYearsAway >= 3 ? "✅ 购房时可提取首套房" : "❌ 购房时仍不满 3 年，不可提取"}`} color={COLORS.purple} />

              <div style={labelStyle}>③ 伴侣薪资</div>
              <SliderRow label="伴侣年薪（税前，无则为 0）" value={partnerSalary} min={0} max={200000} step={1000} unit="$" onChange={setPartnerSalary} color={COLORS.cyan} />

              <div style={labelStyle}>④ 伴侣 KiwiSaver</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                {[3,4,6,8,10].map(v => (
                  <button key={v} onClick={() => setPartnerKiwiRate(v)} style={{
                    flex: 1, padding: "7px 0", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700,
                    background: partnerKiwiRate === v ? COLORS.blue : "#1e293b",
                    color: partnerKiwiRate === v ? "#0f172a" : "#64748b",
                    border: `1px solid ${partnerKiwiRate === v ? COLORS.blue : "#334155"}`,
                  }}>{v}%</button>
                ))}
              </div>
              <div style={{ fontSize: 11, color: "#475669", marginBottom: 12 }}>伴侣员工缴纳比例</div>
              <SliderRow label="伴侣 KiwiSaver 现有余额" value={partnerKiwiBalance} min={0} max={200000} step={500} unit="$" onChange={setPartnerKiwiBalance} color={COLORS.blue} />
              <SliderRow label="伴侣 KiwiSaver 已加入年数" value={partnerKiwiYears} min={0} max={30} step={1} unit="年" onChange={setPartnerKiwiYears} note={`${partnerKiwiYears + purchaseYearsAway >= 3 ? "✅ 购房时可提取首套房" : "❌ 购房时仍不满 3 年，不可提取"}`} color={COLORS.blue} />

              <div style={labelStyle}>⑤ 共用设定</div>
              <div style={{ fontSize: 11, color: "#94a3b8", marginBottom: 6 }}>雇主强制配套（本人 & 伴侣）</div>
              <div style={{ display: "flex", gap: 5, marginBottom: 6, flexWrap: "wrap" }}>
                {[0, 3, 3.5, 4, 5].map(v => {
                  const isActive = employerMatchRate === v;
                  return (
                    <button key={v} onClick={() => setEmployerMatchRate(v)} style={{
                      flex: 1, minWidth: 42, padding: "7px 4px", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700,
                      background: isActive ? COLORS.green : "#1e293b",
                      color: isActive ? "#0f172a" : "#64748b",
                      border: `1px solid ${isActive ? COLORS.green : "#334155"}`,
                    }}>{v}%</button>
                  );
                })}
                <div style={{
                  display: "flex", alignItems: "center", gap: 3,
                  background: [0, 3, 3.5, 4, 5].includes(employerMatchRate) ? "#1e293b" : COLORS.green,
                  borderRadius: 7, padding: "4px 8px", border: `1px solid ${[0, 3, 3.5, 4, 5].includes(employerMatchRate) ? "#334155" : COLORS.green}`,
                  flex: 1, minWidth: 72,
                }}>
                  <input type="number" value={employerMatchRate} min={0} max={10} step={0.1}
                    onChange={e => setEmployerMatchRate(Number(e.target.value) || 0)}
                    style={{
                      width: "100%", background: "transparent", border: "none", outline: "none",
                      color: [0, 3, 3.5, 4, 5].includes(employerMatchRate) ? "#64748b" : "#0f172a",
                      fontSize: 12, fontWeight: 700, textAlign: "center",
                    }} />
                  <span style={{ fontSize: 11, fontWeight: 700, color: [0, 3, 3.5, 4, 5].includes(employerMatchRate) ? "#475669" : "#0f172a" }}>%</span>
                </div>
              </div>
              <div style={{ fontSize: 11, color: "#475669", marginBottom: 14 }}>预设快捷选择 0–5%，亦可直接输入自定义百分比（0–10%）。现行 3%，2026 年起 3.5%，2028 年起 4%（扣除 ESCT 税后入账）</div>
              <SliderRow label="预计几年后购房" value={purchaseYearsAway} min={0} max={15} step={1} unit="年" onChange={setPurchaseYearsAway} color={COLORS.amber} />

            </div>
            <div style={panelStyle}>
              <div style={{ fontSize: 11, color: COLORS.red, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 14 }}>🧾 税务分解（年度）</div>
              <TaxBracketBar gross={income.combined} tax={income.paye} acc={income.acc} kiwiEmp={income.kiwiEmp} />
              <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 0 }}>
                {[
                  ["税前总收入", income.combined, "#e2e8f0"],

                    <span style={{ fontSize: 12, color: "#64748b" }}>{row[0]}</span>

                      {row[1] < 0 ? "−" : ""}{fmtFull(Math.abs(row[1]))}

              </div>
              <div style={{ marginTop: 12, fontSize: 11, color: "#475669", padding: "8px 10px", background: "#0a0f1a", borderRadius: 6, borderLeft: `2px solid ${COLORS.amber}` }}>
                实际到手税率：{fmtPct((income.paye + income.acc) / income.combined * 100)}（含ACC）

          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={panelStyle}>
              <div style={{ fontSize: 11, color: COLORS.amber, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 14 }}>🏦 银行资格 & 负担能力</div>
              <Gauge label="月供占税后收入比（买房）" value={income.mortgageToIncome} max={100} warn={35} danger={45} />
              <Gauge label="买房净月支出占收入比(扣租金)" value={income.totalBuyToIncomeNet} max={100} warn={40} danger={55} />

              <Gauge label="债务收入比（DTI）" value={income.dti} max={8} warn={5} danger={6} unit="x" />
              <div style={{ marginTop: 14, padding: 12, borderRadius: 8, background: bankPass ? "#064e3b33" : "#7f1d1d33", border: `1px solid ${bankPass ? COLORS.green : COLORS.red}` }}>
                <div style={{ fontSize: 13, fontWeight: 800, color: bankPass ? COLORS.green : COLORS.red, marginBottom: 6 }}>

                  贷款额 {fmtFull(loanAmt)} · 联合年收入 {fmtFull(income.combined)} · DTI = {income.dti.toFixed(2)}x
                </div>
              </div>
              <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {[
                  ["月供", fmtFull(income.monthlyMortgage), COLORS.amber],
                  ["压力测试月供", fmtFull(income.stressMortgage), COLORS.red],

      {/* ════════════════════════════════════════════════════════════════ */}
      {/* PARAMS TAB                                                       */}
      {/* ════════════════════════════════════════════════════════════════ */}
      {tab === "params" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div style={panelStyle}>
            <div style={{ fontSize: 11, color: COLORS.amber, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 16 }}>📈 市场假设</div>
            <SliderRow label="房价年增长率" value={appreciation} min={0} max={10} step={0.5} unit="%" onChange={setAppreciation} note="NZ历史均值 4–7%，基督城近5年约 6%" color={COLORS.amber} />
            <SliderRow label="股市/基金年回报（不买房时）" value={investReturn} min={2} max={15} step={0.5} unit="%" onChange={setInvestReturn} note="NZX50约 7–9%，KiwiSaver成长型约 6–8%" color={COLORS.blue} />
            <SliderRow label="分析年限" value={analyzeYears} min={5} max={30} step={1} unit="年" onChange={setAnalyzeYears} note="持有时间越长买房通常越有优势" color={COLORS.green} />
          </div>
          <div style={panelStyle}>
            <div style={{ fontSize: 11, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 14 }}>📋 NZ 市场参考（2025）</div>
            {[
              ["基督城房价中位数", "~$680k–$780k"],
              ["奥克兰房价中位数", "~$980k–$1.1M"],
              ["基督城周租均值（3卧）", "~$520–$600"],
              ["固定贷款利率（2年）", "~5.7–6.5%"],
              ["RBNZ DTI上限", "6x（总债务/年收入）"],
              ["NZX50历史年均含息回报", "~7–9%"],
              ["NZ房价历史年均增长", "~4–7%（40年）"],
              ["最低首付要求", "20%（部分10%）"],
              ["Bright-line适用期", "持有不满2年（投资房）"],
              ["Kāinga Ora 首次购房补贴", "已取消（2024年5月）"],
              ["KiwiSaver首套提取门槛", "持有满3年"],
            ].map(([k,v]) => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #0f172a" }}>
                <span style={{ fontSize: 11, color: "#64748b" }}>{k}</span>
                <span style={{ fontSize: 11, fontFamily: "'DM Mono',monospace", color: "#e2e8f0", fontWeight: 600 }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ════════════════════════════════════════════════════════════════ */}
      {/* RESULTS TAB                                                      */}
      {/* ════════════════════════════════════════════════════════════════ */}
      {tab === "results" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
            {[
              { l: "第一天需准备", v: fmtFull(down + oneTimeCosts), c: COLORS.green },
              { l: "净买房月支出", v: fmtFull(income.totalBuyMonthlyNet), c: COLORS.amber },
              { l: "租房月均支出", v: fmtFull(income.rentMonthly), c: COLORS.blue },
              { l: "银行资格", v: bankPass ? "✅ 通过" : "❌ 不通过", c: bankPass ? COLORS.green : COLORS.red },
              { l: "盈亏平衡", v: breakEven ? `第${breakEven}年` : "期内未达", c: COLORS.purple },
            ].map(s => (
              <div key={s.l} style={{ background: "#111827", borderRadius: 10, padding: "12px 14px", border: "1px solid #1e293b" }}>
                <div style={{ fontSize: 10, color: "#475669", textTransform: "uppercase", marginBottom: 5 }}>{s.l}</div>
                <div style={{ fontSize: 15, fontWeight: 800, color: s.c, fontFamily: "'DM Mono',monospace" }}>{s.v}</div>
              </div>
            ))}
          </div>
          <div style={panelStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14, alignItems: "center" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#94a3b8" }}>净资产对比（{analyzeYears}年）</div>
              <div style={{ display: "flex", gap: 16 }}>
                <span style={{ fontSize: 11, color: COLORS.green }}>▬ 买房净资产</span>
                <span style={{ fontSize: 11, color: COLORS.blue }}>▬ 租房+投资净资产</span>
              </div>
            </div>
            <ResponsiveContainer width="100%" height={260}>
              <LineChart data={chartData} margin={{ top: 5, right: 5, bottom: 0, left: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                <XAxis dataKey="year" stroke="#1e293b" tick={{ fill: "#475669", fontSize: 11 }} tickFormatter={v => `${v}y`} />
                <YAxis stroke="#1e293b" tick={{ fill: "#475669", fontSize: 11 }} tickFormatter={fmt} />
                <Tooltip content={<CustomTooltip />} />
                {breakEven && <ReferenceLine x={breakEven} stroke={COLORS.amber} strokeDasharray="5 5" label={{ value: `平衡点 ${breakEven}年`, fill: COLORS.amber, fontSize: 10, position: "top" }} />}
                <Line type="monotone" dataKey="buying" name="买房净资产" stroke={COLORS.green} strokeWidth={2.5} dot={false} />
                <Line type="monotone" dataKey="renting" name="租房+投资净资产" stroke={COLORS.blue} strokeWidth={2.5} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
          <div style={{ background: "#111827", borderRadius: 12, padding: 20, border: `2px solid ${winner === "buy" ? COLORS.green : COLORS.blue}` }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: winner === "buy" ? COLORS.green : COLORS.blue, marginBottom: 14 }}>
              {winner === "buy" ? `🏠 ${analyzeYears}年维度下买房净资产更高` : `📈 ${analyzeYears}年维度下租房+投资净资产更高`}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 14 }}>
              {[
                { l: `买房${analyzeYears}年后净资产`, v: fmtFull(finalBuy), c: COLORS.green },
                { l: `租房+投资${analyzeYears}年后净资产`, v: fmtFull(finalRent), c: COLORS.blue },
                { l: "两者差额", v: fmtFull(Math.abs(finalBuy - finalRent)), c: winner === "buy" ? COLORS.green : COLORS.blue },
              ].map(s => (
                <div key={s.l} style={{ background: "#0a0f1a", borderRadius: 8, padding: 12 }}>
                  <div style={{ fontSize: 10, color: "#475669", marginBottom: 4 }}>{s.l}</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: s.c, fontFamily: "'DM Mono',monospace" }}>{s.v}</div>
                </div>
              ))}
            </div>
            <div style={{ fontSize: 11, color: "#475669", lineHeight: 1.9 }}>
              ⚠️ 免责：① 租金/房价固定增长为简化假设 ② 未计通胀 ③ Bright-line仅投资房适用 ④ KiwiSaver提取已在首付中体现 ⑤ <strong style={{ color: "#e2e8f0" }}>非PR/公民无法购住宅用地</strong> ⑥ 建议购房前咨询注册律师与贷款经纪人
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
