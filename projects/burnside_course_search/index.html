    color: #cfe9dc;

    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card-top {

  }
  .code {

    font-size: 15px;

  }

    color: #9fcbb5;
    background: #0d2019;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;

    color: #d9d6f7;
    background: #2c2864;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;

    color: #a9c9bb;

let currentStage = 'all';

const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const inputEl = document.getElementById('q');

function groupOrder(cat){
  const order = ["English","Mathematics","Science","Social Sciences","Health & PE","Creative Arts","Languages","Technology","Student Support"];
  return order.indexOf(cat);
}

function render() {
  const v = inputEl.value.trim().toLowerCase();
  let filtered = data;
  if (currentStage !== 'all') {
    filtered = filtered.filter(r => r[2] === currentStage);
  }
  if (currentCat !== 'all') {
    filtered = filtered.filter(r => r[4] === currentCat);
  }
  if (v) {
    filtered = filtered.filter(r =>
      r[0].toLowerCase().includes(v) || r[1].toLowerCase().includes(v)
    );
  }

  const noFilterActive = !v && currentStage === 'all' && currentCat === 'all';
  if (noFilterActive) {
    resultsEl.innerHTML = '';
    countEl.textContent = '';
    emptyEl.style.display = 'none';
    return;
  }

  if (filtered.length === 0) {
    resultsEl.innerHTML = '';
    countEl.textContent = '';
    emptyEl.style.display = 'block';
    return;
  }

  emptyEl.style.display = 'none';
  countEl.textContent = `找到 ${filtered.length} 项`;

  // group by category for readability
  const sorted = [...filtered].sort((a,b) => groupOrder(a[4]) - groupOrder(b[4]));
  let html = '';
  let lastCat = null;
  for (const r of sorted) {
    if (r[4] !== lastCat) {
      html += `<div class="group-header">${r[4]}</div>`;
      lastCat = r[4];
    }
    html += `
      <div class="card">
        <div class="card-top">
          <span class="code">${r[0]}</span>
          <div class="badges">
            <span class="stage">${r[2]}</span>
          </div>
        </div>
        <div class="name">${r[1]}</div>
        ${r[3] ? `<div class="note">${r[3]}</div>` : ''}
      </div>`;
  }
  resultsEl.innerHTML = html;
}

inputEl.addEventListener('input', render);

document.querySelectorAll('.filter-btn[data-stage]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-stage]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStage = btn.dataset.stage;
    render();
  });
});

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

render();
