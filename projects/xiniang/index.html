<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>喜娘上上牵 · 单身资料管理系统</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
// ===== 鉴权辅助 =====
function getAuthHeader() {
    const token = localStorage.getItem(CONFIG.TOKEN_KEY || 'xiniang_admin_token');
    if (!token) return {'Content-Type': 'application/json'};
    return {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token};
}
function apiUrl(path) {
    // 写操作走 API_BASE，读操作由调用方决定
    return CONFIG.API_BASE.replace(/\/$/, '') + path;
}
// 状态循环切换：待审核 → 已通过 → 已过期 → 待审核
function cycleStatus(recordId, currentStatus) {
    const next = {
        'pending': 'approved',
        'approved': 'expired',
        'expired': 'pending'
    };
    const labels = {'pending':'待审核', 'approved':'已通过', 'expired':'已过期'};
    const newStatus = next[currentStatus] || 'pending';
    if (!confirm(`确定将状态改为「${labels[newStatus]}」？`)) return;
    
    // 调用 update_record API（JWT 鉴权）
    fetch(apiUrl(`/api/record/${recordId}`), {
        method: 'PUT',
        headers: getAuthHeader(),
        body: JSON.stringify({
            record: {status: newStatus}
        })
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            alert('状态已更新为：' + labels[newStatus]);
            loadData();
        } else {
            alert('更新失败：' + res.message);
        }
    })
    .catch(err => {
        alert('请求失败：' + err);
    });
}
</script>
<script src="config.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    color-scheme: light;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-brand: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    --bg: oklch(98.4% 0.008 355);
    --surface: oklch(99.6% 0.004 355);
    --surface-soft: oklch(97.2% 0.014 355);
    --surface-strong: oklch(93.8% 0.018 355);
    --text: oklch(30% 0.023 355);
    --text-muted: oklch(52% 0.028 355);
    --text-subtle: oklch(66% 0.026 355);
    --border: oklch(90.5% 0.023 355);
    --border-strong: oklch(80.5% 0.04 355);
    --primary: oklch(61% 0.145 355);
    --primary-hover: oklch(55% 0.16 355);
    --primary-soft: oklch(95.5% 0.035 355);
    --primary-ring: oklch(76% 0.105 355);
    --male: oklch(62% 0.115 235);
    --male-soft: oklch(95.2% 0.032 235);
    --female: oklch(64% 0.125 355);
    --female-soft: oklch(95.7% 0.034 355);
    --success: oklch(58% 0.095 152);
    --success-soft: oklch(94.5% 0.045 152);
    --danger: oklch(56% 0.18 25);
    --danger-soft: oklch(94% 0.045 25);
    --warning: oklch(67% 0.14 70);
    --warning-soft: oklch(95% 0.05 70);
    --info: oklch(56% 0.13 235);
    --info-soft: oklch(94% 0.045 235);
    --shadow-sm: 0 1px 2px oklch(35% 0.03 355 / 0.06), 0 8px 24px oklch(35% 0.03 355 / 0.05);
    --shadow-md: 0 14px 36px oklch(35% 0.03 355 / 0.12);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --ease: cubic-bezier(.16, 1, .3, 1);
}

html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: var(--font-ui);
    background:
        linear-gradient(180deg, oklch(99.1% 0.011 355), var(--bg) 360px),
        var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
}

button, input, select, textarea {
    font: inherit;
}

button {
    min-height: 38px;
}

button, select, input, textarea {
    transition: border-color 180ms var(--ease), background-color 180ms var(--ease), color 180ms var(--ease), box-shadow 180ms var(--ease), transform 180ms var(--ease);
}

button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
    outline: 3px solid oklch(71% 0.13 355 / 0.36);
    outline-offset: 2px;
}

/* 顶部导航 */
.navbar {
    min-height: 64px;
    padding: 10px clamp(14px, 3vw, 30px);
    background: oklch(99% 0.006 355 / 0.94);
    color: var(--text);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 oklch(100% 0.004 355 / 0.8);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.navbar h1 {
    font-size: 18px;
    font-family: var(--font-brand);
    font-weight: 750;
    letter-spacing: 0;
    white-space: nowrap;
}
.navbar .nav-btns {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
}
.navbar button {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
    box-shadow: 0 1px 1px oklch(35% 0.03 355 / 0.04);
}
.navbar button:hover {
    color: var(--primary);
    border-color: var(--primary-ring);
    background: var(--primary-soft);
}
.navbar button:active { transform: translateY(1px); }

/* 主容器 */
.container { max-width: 1440px; margin: 0 auto; padding: 24px clamp(14px, 2.4vw, 28px) 40px; }

/* 统计卡片 */
.stats-row { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat-card {
    min-height: 116px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    display: grid;
    align-content: space-between;
    text-align: left;
    position: relative;
    overflow: hidden;
}
.stat-card::before {
    content: "";
    width: 4px;
    position: absolute;
    inset: 14px auto 14px 0;
    border-radius: 0 999px 999px 0;
    background: var(--primary);
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card .num { font-size: 30px; line-height: 1; font-weight: 780; color: var(--text); letter-spacing: 0; }
.stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 8px; font-weight: 650; }
.stat-card .icon { width: 34px; height: 34px; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 18px; margin-bottom: 12px; }
.stat-card-total::before  { background: var(--primary); }
.stat-card-male::before   { background: var(--male); }
.stat-card-female::before { background: var(--female); }
.stat-card-region::before { background: var(--success); }
.stat-card-avg::before    { background: var(--warning); }
.stat-card-male .icon { background: var(--male-soft); color: var(--male); }
.stat-card-female .icon { background: var(--female-soft); color: var(--female); }
.stat-card-region .icon { background: var(--success-soft); color: var(--success); }
.stat-card-avg .icon { background: var(--warning-soft); color: var(--warning); }

/* 图表区 */
.charts-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.charts-row-full { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
.chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: 0 1px 2px oklch(35% 0.03 355 / 0.04), 0 8px 20px oklch(35% 0.03 355 / 0.035);
}
.chart-box:hover { box-shadow: var(--shadow-md); }
.chart-box h3 {
    font-size: 14px; font-weight: 730; color: var(--text); margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
}
.chart-box h3 .chart-badge {
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid oklch(84% 0.075 355);
    font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 700;
}
.chart-container { width: 100%; height: 300px; }
.chart-container-tall { width: 100%; height: 380px; }
.chart-container-md { width: 100%; height: 260px; }

/* 操作栏 */
.toolbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow-sm); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar select, .toolbar input { min-height: 40px; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font-size: 14px; }
.toolbar select:hover, .toolbar input:hover { border-color: var(--border-strong); }
.toolbar input[type=text] { width: min(240px, 100%); }
.toolbar button { padding: 8px 14px; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; font-weight: 700; }
.btn-primary { background: var(--primary); color: oklch(99% 0.006 355); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-secondary { background: var(--surface-soft); color: var(--text-muted); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-strong); color: var(--text); }
.btn-success { background: var(--success); color: oklch(99% 0.006 152); border: 1px solid var(--success); }
.btn-danger { background: var(--danger); color: oklch(99% 0.006 25); border: 1px solid var(--danger); }

/* 数据表格 */
.data-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-sm); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead { background: var(--surface-soft); }
th { padding: 11px 10px; text-align: left; font-weight: 750; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
tr:hover { background: var(--primary-soft); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin: 2px; font-weight: 650; }
.tag-male { background: var(--male-soft); color: var(--male); }
.tag-female { background: var(--female-soft); color: var(--female); }
.action-btn { min-height: 32px; padding: 5px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 700; margin: 2px; }

/* 视图切换 */
.view-toggle { display: flex; gap: 4px; align-items: center; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-soft); }
.view-toggle button { min-height: 34px; padding: 6px 12px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 700; }
.view-toggle button.active { background: var(--surface); color: var(--primary); border-color: var(--border); box-shadow: 0 1px 2px oklch(35% 0.03 355 / 0.06); }

/* 卡片网格 */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; padding: 2px 0; }
.person-card {
    background: var(--surface); border-radius: var(--radius-lg); padding: 0;
    box-shadow: var(--shadow-sm); transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    border: 1px solid var(--border);
}
.person-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.person-card.selected { border-color: var(--primary-ring); box-shadow: 0 0 0 3px oklch(71% 0.13 355 / 0.22), var(--shadow-sm); }

/* 卡片顶部彩条 */
.card-top-bar { height: 3px; width: 100%; }
.card-top-bar-male   { background: var(--male); }
.card-top-bar-female { background: var(--female); }
.card-top-bar-other  { background: var(--text-subtle); }

.card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card-header { display: flex; align-items: center; gap: 12px; }
.card-avatar {
    width: 52px; height: 52px; border-radius: var(--radius-md); display: flex; align-items: center;
    justify-content: center; font-size: 25px; flex-shrink: 0;
    border: 1px solid var(--border);
}
.card-avatar-male   { background: var(--male-soft); }
.card-avatar-female { background: var(--female-soft); }
.card-avatar-other  { background: var(--surface-soft); }
.card-meta { flex: 1; min-width: 0; }
.card-meta .card-id { font-size: 11px; color: var(--text-subtle); margin-bottom: 2px; font-weight: 650; }
.card-meta .card-region { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta .card-gender-badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; margin-top: 5px; font-weight: 750;
}
.badge-male   { background: var(--male-soft); color: var(--male); }
.badge-female { background: var(--female-soft); color: var(--female); }

/* 高度进度条 */
.card-height-bar { margin: 0 0 2px; }
.card-height-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-subtle); margin-bottom: 4px; font-weight: 650; }
.height-track { height: 6px; background: var(--surface-strong); border-radius: 999px; overflow: hidden; }
.height-fill { height: 100%; border-radius: 3px; }
.height-fill-male   { background: var(--male); }
.height-fill-female { background: var(--female); }

.card-stats { display: flex; gap: 5px; flex-wrap: wrap; }
.card-chip {
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: var(--surface-soft); color: var(--text-muted); white-space: nowrap;
}
.chip-age    { background: var(--success-soft); color: var(--success); }
.chip-height { background: var(--male-soft); color: var(--male); }
.chip-edu    { background: var(--primary-soft); color: var(--primary); }
.chip-job    { background: var(--warning-soft); color: oklch(46% 0.12 70); max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.card-info-row { font-size: 12px; color: var(--text-muted); line-height: 1.55; border-top: 1px solid var(--border); padding-top: 8px; }
.card-info-row strong { color: var(--text); }

.card-actions { display: flex; gap: 6px; padding: 10px 16px; background: var(--surface-soft); border-top: 1px solid var(--border); }
.card-actions button { flex: 1; padding: 7px 8px; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; font-size: 12px; font-weight: 750; min-width: 44px; }
.btn-view    { background: var(--info-soft); color: var(--info); }
.btn-edit    { background: var(--warning-soft); color: oklch(46% 0.12 70); }
.btn-del     { background: var(--danger-soft); color: var(--danger); }
.btn-compare { background: var(--primary); color: oklch(99% 0.006 355); }
.btn-compare.in-compare { background: var(--success); color: oklch(99% 0.006 152); }
.card-actions button:hover { transform: translateY(-1px); filter: saturate(1.06); }

/* 对比浮动条 */
.compare-bar {
    position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--surface); border-radius: var(--radius-lg); padding: 12px;
    box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 10px;
    z-index: 150; border: 1px solid var(--primary-ring); min-width: min(620px, calc(100vw - 24px));
    transition: opacity 180ms var(--ease), transform 180ms var(--ease); opacity: 0; pointer-events: none;
}
.compare-bar.visible { opacity: 1; pointer-events: all; }
.compare-slot {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md); min-width: 128px;
    font-size: 13px; color: var(--text-subtle); cursor: default;
}
.compare-slot.filled { border-color: var(--primary-ring); color: var(--text); font-weight: 700; background: var(--primary-soft); }
.compare-bar-btn {
    padding: 8px 14px; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer;
    font-size: 13px; font-weight: 700; transition: 0.2s;
}
.btn-do-compare { background: var(--primary); color: oklch(99% 0.006 355); }
.btn-do-compare:disabled { background: var(--surface-strong); color: var(--text-subtle); cursor: default; }
.btn-clear-compare { background: var(--surface-soft); color: var(--text-muted); border-color: var(--border); }

/* 对比弹窗 */
#compareModal .modal { width: 760px; max-width: 95vw; }
.compare-radar-wrap { display: flex; gap: 20px; align-items: flex-start; }
.compare-radar-chart { flex: 1; height: 360px; }
.compare-info-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.compare-col { padding: 14px; border-radius: var(--radius-md); }
.compare-col-a { background: var(--male-soft); border: 1px solid oklch(84% 0.055 235); }
.compare-col-b { background: var(--female-soft); border: 1px solid oklch(84% 0.055 355); }
.compare-col h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.compare-col .ci { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.compare-score-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.compare-score-bar span:first-child { font-size: 12px; color: var(--text-muted); width: 60px; flex-shrink: 0; }
.score-track { flex: 1; height: 8px; background: var(--surface-strong); border-radius: 4px; overflow: hidden; }
.score-fill-a { height: 100%; background: var(--male); border-radius: 4px; }
.score-fill-b { height: 100%; background: var(--female); border-radius: 4px; }
.compare-score-bar span:last-child { font-size: 12px; font-weight: 700; width: 28px; text-align: right; }

/* 弹窗 */
.modal-overlay { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: oklch(22% 0.03 355 / 0.48); z-index: 200; justify-content: center; align-items: center; padding: 18px; }
.modal-overlay.active { display: flex; }
/* 编辑弹窗在管理员中心之上 */
#editModal { z-index: 300; }
#userSubmitModal { z-index: 300; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 600px; max-width: min(100%, 760px); max-height: calc(100vh - 36px); overflow-y: auto; box-shadow: 0 22px 70px oklch(22% 0.03 355 / 0.28); }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-header h3 { font-size: 17px; color: var(--text); font-weight: 800; }
.modal-close { width: 38px; min-height: 38px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 22px; cursor: pointer; color: var(--text-muted); line-height: 1; }
.modal-close:hover { color: var(--danger); border-color: oklch(82% 0.075 25); background: var(--danger-soft); }
.modal-body { padding: 22px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0; background: var(--surface); }

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 750; }
.form-group input, .form-group select, .form-group textarea { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; }
.form-group input::placeholder, .form-group textarea::placeholder { color: oklch(55% 0.034 355); }
.form-group input:hover, .form-group select:hover, .form-group textarea:hover { border-color: var(--border-strong); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* 分页 */
.pagination { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 16px; flex-wrap: wrap; }
.pagination button { min-height: 36px; padding: 6px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 700; }
.pagination button:hover:not(:disabled) { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-ring); }
.pagination button:disabled { border-color: var(--border); background: var(--surface-soft); color: var(--text-subtle); cursor: default; }
.pagination button.active-page { background: var(--primary); color: oklch(99% 0.006 355); border-color: var(--primary); font-weight: 750; }
.pagination .ellipsis { margin: 0 3px; color: var(--text-subtle); font-size: 13px; }
.pagination .page-info { margin-left: 12px; font-size: 12px; color: var(--text-subtle); }

/* 密码弹窗 */
.pwd-modal .modal { width: 400px; }
.pwd-modal input[type=password] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 16px; text-align: center; letter-spacing: 3px; }
.pwd-modal input[type=password]:focus { border-color: var(--primary-ring); }

/* 管理员中心 */
#adminCenterModal .modal {
    width: min(1120px, calc(100vw - 36px));
    max-width: min(1120px, calc(100vw - 36px));
    background: var(--surface-soft);
}
#adminCenterModal .modal-header {
    background: var(--surface);
}
#adminCenterModal .modal-body {
    padding: 0;
}
.admin-shell {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    min-height: min(680px, calc(100vh - 126px));
}
.tab-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px;
    border-right: 1px solid var(--border);
    background: oklch(98.7% 0.009 355);
    overflow: auto;
}
.tab-btn {
    min-height: 44px;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    text-align: left;
    white-space: nowrap;
    font-weight: 720;
}
.tab-btn:hover {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);
}
.tab-btn.active {
    color: var(--primary);
    background: var(--surface);
    border-color: oklch(86% 0.055 355);
    box-shadow: 0 1px 2px oklch(35% 0.03 355 / 0.04);
}
.admin-workspace {
    min-width: 0;
    padding: 18px;
    background: var(--surface);
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.admin-action-row {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 12px;
    align-items: end;
    padding: 14px;
    margin-bottom: 14px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
}
.admin-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 14px;
    margin-bottom: 14px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
}
.admin-form-actions {
    display: flex;
    justify-content: flex-end;
    margin: -2px 0 14px;
}
.admin-table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
}
.admin-table-wrap table {
    min-width: 680px;
}
.admin-table-wrap thead {
    background: oklch(97.5% 0.012 355);
}
.admin-table-wrap th {
    font-size: 12px;
    text-transform: none;
}
.admin-badge {
    display: inline-flex;
    min-width: 18px;
    height: 18px;
    align-items: center;
    justify-content: center;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--danger);
    color: oklch(99% 0.006 25);
    font-size: 11px;
    font-weight: 800;
}
.nav-badge {
    display: inline-flex;
    min-width: 18px;
    height: 18px;
    align-items: center;
    justify-content: center;
    margin-left: 5px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--danger);
    color: oklch(99% 0.006 25);
    font-size: 11px;
    font-weight: 800;
}

/* 审核记录卡片 */
.review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px oklch(35% 0.03 355 / 0.035); }
.review-card h4 { font-size: 14px; color: var(--text); margin-bottom: 8px; font-weight: 780; }
.review-card p { font-size: 13px; color: var(--text-muted); margin: 3px 0; }
.review-actions { margin-top: 10px; display: flex; gap: 8px; }

.compare-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--primary);
    white-space: nowrap;
}

.empty-state {
    color: var(--text-muted);
    text-align: center;
    padding: 40px 16px;
}

.text-muted { color: var(--text-muted); }
.text-danger { color: var(--danger); }
.status-badge { font-weight: 750; }
.status-pending { color: oklch(50% 0.13 70); }
.status-approved { color: var(--success); }
.status-rejected { color: var(--danger); }
.error-message {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
}
.expired-warning {
    color: var(--danger);
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: 700;
}

/* 响应式 */
@media (max-width: 1180px) {
    .stats-row { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
}

@media (max-width: 920px) {
    .navbar { align-items: flex-start; flex-direction: column; }
    .navbar h1 { white-space: normal; }
    .navbar .nav-btns { justify-content: flex-start; width: 100%; }
    .charts-row { grid-template-columns: 1fr; }
    .charts-row-full { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .admin-shell {
        grid-template-columns: 1fr;
        min-height: auto;
    }
    .tab-header {
        flex-direction: row;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        padding: 10px;
        background: var(--surface);
    }
    .tab-btn { flex: 0 0 auto; }
    .admin-workspace { padding: 14px; }
    .admin-form-grid, .admin-action-row { grid-template-columns: 1fr; }
}

@media (max-width: 700px) {
    body { font-size: 14px; }
    .container { padding: 16px 12px 34px; }
    .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-card { min-height: 104px; padding: 14px; }
    .stat-card .num { font-size: 25px; }
    .toolbar { display: grid; grid-template-columns: 1fr; }
    .toolbar input[type=text], .toolbar select, .toolbar button, .view-toggle { width: 100%; }
    .view-toggle { grid-template-columns: 1fr 1fr; display: grid; }
    .card-grid { grid-template-columns: 1fr; }
    .chart-container { height: 280px; }
    .chart-container-tall { height: 330px; }
    .compare-bar { align-items: stretch; flex-direction: column; }
    .compare-slot { width: 100%; }
    .compare-info-cols { grid-template-columns: 1fr; }
    .modal-overlay { padding: 10px; align-items: flex-end; }
    .modal { width: 100%; max-height: calc(100vh - 20px); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    #adminCenterModal .modal {
        width: 100%;
        max-width: 100%;
    }
    .modal-body, .modal-header, .modal-footer { padding-left: 16px; padding-right: 16px; }
    #adminCenterModal .modal-body { padding: 0; }
    .admin-workspace { padding: 12px; }
    .data-table-wrap { padding: 8px; }
    table { font-size: 13px; }
    th, td { padding: 9px 8px; }
}

@media (pointer: coarse) {
    button, .action-btn, .navbar button, .pagination button { min-height: 44px; }
}

@media (hover: none) {
    .stat-card:hover,
    .chart-box:hover,
    .person-card:hover,
    .card-actions button:hover,
    .btn-primary:hover { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<!-- 顶部导航 -->

// ===== 用户上传表单：自动计算逻辑 =====
const SUBMIT_CURRENT_YEAR = new Date().getFullYear();
const SUBMIT_ZODIAC_LIST = ['猴','鸡','狗','猪','鼠','牛','虎','兔','龙','蛇','马','羊'];

function submitYearToZodiac(y) {
    if (!y || isNaN(y)) return '';
    return SUBMIT_ZODIAC_LIST[parseInt(y) % 12];
}

function onSubmitBirthYearChange() {
    const by = document.getElementById('submitBirthYear').value;
    if (!by) return;
    document.getElementById('submitAgeNum').value = SUBMIT_CURRENT_YEAR - parseInt(by);
    const z = submitYearToZodiac(parseInt(by));
    if (z) document.getElementById('submitZodiac').value = z;
}

function onSubmitAgeChange() {
    const age = document.getElementById('submitAgeNum').value;
    if (!age) return;
    document.getElementById('submitBirthYear').value = SUBMIT_CURRENT_YEAR - parseInt(age);
    const z = submitYearToZodiac(SUBMIT_CURRENT_YEAR - parseInt(age));
    if (z) document.getElementById('submitZodiac').value = z;
}

// ===== 初始化 =====

// ===== 检查登录状态 =====
function checkLoginStatus() {
    fetch(apiUrl('/api/admin/current'), { headers: getAuthHeader() })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                currentAdminInfo = res.data;

            } else {
                hideAdminUI();
            }

}

function showAdminUI() {
    document.getElementById('btnAdminLogin').style.display = 'none';
    document.getElementById('btnAdminCenter').style.display = 'inline-block';
    document.getElementById('btnAdminLogout').style.display = 'inline-block';
    document.getElementById('btnAddData').style.display = 'inline-block';  // 显示添加按钮
    document.getElementById('btnExportExcel').style.display = 'inline-block';  // 显示导出
    document.getElementById('btnReimport').style.display = 'inline-block';    // 显示重新导入
    
    // 根据角色显示/隐藏标签
    if (currentAdminInfo.role === 'super_admin') {
        document.getElementById('tabRegionManageBtn').style.display = 'inline-block';
        document.getElementById('tabAdminManageBtn').style.display = 'inline-block';
    } else {
        document.getElementById('tabRegionManageBtn').style.display = 'none';

    currentAdminInfo = null;

    document.getElementById('btnAdminLogout').style.display = 'none';

    document.getElementById('btnExportExcel').style.display = 'none'; // 隐藏导出

}

// ===== 管理员登录 =====
function openAdminLoginModal() {
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('adminLoginModal').classList.add('active');
    setTimeout(() => document.getElementById('loginUsername').focus(), 100);
}

function adminLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    if (!username || !password) {
        document.getElementById('loginError').textContent = '用户名和密码不能为空';
        document.getElementById('loginError').style.display = 'block';
        return;
    }
    
    fetch(apiUrl('/api/admin/login'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            currentAdminInfo = {username: res.username || username, role: res.role || 'super_admin'};
            showAdminUI();
            closeModal('adminLoginModal');
            alert('登录成功！');
        } else {
            document.getElementById('loginError').textContent = res.message || '登录失败';
            document.getElementById('loginError').style.display = 'block';
        }
    });
}

// ===== 管理员登出 =====
function adminLogout() {
    fetch(apiUrl('/api/admin/logout'), {method: 'POST'})
        .then(r => r.json())
        .then(res => {
            hideAdminUI();
            alert('已退出登录');
        });
}

// ===== 管理员中心 =====
function openAdminCenterModal() {
    document.getElementById('adminCenterModal').classList.add('active');
    // 加载过期资料数量
    loadExpiredCount();
    // 默认加载资料审核标签
    switchTab('tabReview');
    // 加载管理员中心资料管理的地区选项
    loadAdminRegionOptions();
}

function switchTab(tabName) {
    // 更新标签按钮状态
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    const clickEvent = typeof event !== 'undefined' ? event : null;
    const activeBtn = clickEvent && clickEvent.target ? clickEvent.target.closest('.tab-btn') : document.querySelector(`.tab-btn[onclick*="${tabName}"]`);
    if (activeBtn) activeBtn.classList.add('active');
    
    // 更新内容显示
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'tabReview') {
        document.getElementById('tabReviewContent').classList.add('active');
        loadPendingList();
    } else if (tabName === 'tabExpired') {
        document.getElementById('tabExpiredContent').classList.add('active');
        loadExpiredList();
    } else if (tabName === 'tabDataManage') {
        document.getElementById('tabDataManageContent').classList.add('active');
        loadAdminData();
    } else if (tabName === 'tabRegionManage') {
        document.getElementById('tabRegionManageContent').classList.add('active');
        loadRegionManage();
    } else if (tabName === 'tabAdminManage') {
        document.getElementById('tabAdminManageContent').classList.add('active');
        loadAdminManage();
    }
}

// ===== 资料审核功能 =====
function loadPendingList() {
    fetch(apiUrl('/api/admin/pending'), { headers: getAuthHeader() })
        .then(r => r.json())
        .then(res => {
            if (!res.success) {
                document.getElementById('pendingList').innerHTML = '<p class="error-message">加载失败：' + res.message + '</p>';
                return;
            }
            
            const pending = res.data;
            if (pending.length === 0) {
                document.getElementById('pendingList').innerHTML = '<p class="empty-state">暂无待审核记录</p>';
                return;
            }
            
            let html = '';
            pending.forEach(r => {
                html += `
                <div class="review-card">
                    <h4>ID: ${r.id} | ${r.region_group || '-'}</h4>
                    <p>年龄：${r.age_raw || '-'} ${r.age_normalized ? '(' + r.age_normalized + '岁)' : ''}</p>
                    <p>身高：${r.height || '-'} cm | 体重：${r.weight || '-'} kg</p>
                    <p>学历：${r.education || '-'} | 工作：${r.job || '-'}</p>
                    <p>家庭情况：${r.family_info || '-'}</p>
                    <p>择偶要求：${r.mate_requirement || '-'}</p>
                    <p>提交时间：${r.submit_time || '-'}</p>
                    <div class="review-actions">
                        <button class="btn-success" style="padding:6px 16px;font-size:13px;" onclick="approveRecord(${r.id})">✅ 通过</button>
                        <button class="btn-danger" style="padding:6px 16px;font-size:13px;" onclick="openRejectModal(${r.id})">❌ 拒绝</button>
                    </div>
                </div>
                `;
            });
            
            document.getElementById('pendingList').innerHTML = html;
        });
}

function approveRecord(id) {
    if (!confirm('确定要通过这条记录吗？')) return;
    
    fetch(apiUrl('/api/admin/review'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id, action: 'approve'})
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            alert('审核通过！');
            loadPendingList();
            loadStats();
        } else {
            alert('操作失败：' + res.message);
        }
    });
}

function openRejectModal(id) {
    currentRejectId = id;
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').classList.add('active');
}

function confirmReject() {
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
        alert('请填写拒绝理由！');
        return;
    }
    
    fetch(apiUrl('/api/admin/review'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: currentRejectId, action: 'reject', reject_reason: reason})
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            alert('已拒绝！');
            closeModal('rejectModal');
            loadPendingList();
        } else {
            alert('操作失败：' + res.message);
        }
    });
}


// ===== 渲染管理员资料表格 =====
function renderAdminTable(data) {
    if (!data || data.length === 0) {
        document.getElementById('adminDataTable').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">暂无数据</p>';
        return;
    }
    let html = '<div class="admin-table-wrap"><table><thead><tr>';
    html += '<th>ID</th><th>地区</th><th>年龄</th><th>身高</th><th>体重</th><th>学历</th><th>状态</th><th>操作</th>';
    html += '</tr></thead><tbody>';
    data.forEach(r => {
        const statusText = r.status === 'pending' ? '待审核' : r.status === 'approved' ? '已通过' : '已过期';
        const statusClass = r.status === 'pending' ? 'status-pending' : r.status === 'approved' ? 'status-approved' : 'status-rejected';
        html += '<tr>';
        html += '<td>' + r.id + '</td>';
        html += '<td>' + (r.region_group || '-') + '</td>';
        html += '<td>' + (r.age_raw || '') + ' ' + (r.age_normalized ? '(' + r.age_normalized + ')' : '') + '</td>';
        html += '<td>' + (r.height || '-') + '</td>';
        html += '<td>' + (r.weight || '-') + '</td>';
        html += '<td>' + (r.education || '-') + '</td>';
        html += '<td><span class="status-badge ' + statusClass + '" style="cursor:pointer" onclick="cycleStatus(' + r.id + ', \'' + (r.status||'approved') + '\')">' + statusText + '</span></td>';
        html += '<td><button class="action-btn btn-edit" onclick="openEditModal(' + r.id + ')">编辑</button> <button class="action-btn btn-del" onclick="deleteRecord(' + r.id + ')">删除</button></td>';
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('adminDataTable').innerHTML = html;
}

// ===== 资料管理功能（管理员）=====
function loadAdminData() {
    // 静态模式：直接从 allData 读取
    if (CONFIG.STATIC_MODE) {
        let data = allData || [];
        const region = document.getElementById('adminFilterRegion') ? document.getElementById('adminFilterRegion').value : '';
        const statusFilter = document.getElementById('adminFilterStatus') ? document.getElementById('adminFilterStatus').value : '';
        const keyword = document.getElementById('adminSearchInput') ? document.getElementById('adminSearchInput').value : '';
        if (region) data = data.filter(r => r.region_group === region);
        if (statusFilter) data = data.filter(r => r.status === statusFilter);
        if (keyword) data = data.filter(r => JSON.stringify(r).includes(keyword));
        renderAdminTable(data);
        return;
    }
    // 构建筛选参数
    const region = document.getElementById('adminFilterRegion') ? document.getElementById('adminFilterRegion').value : '';
    const ageRange = document.getElementById('adminFilterAgeRange') ? document.getElementById('adminFilterAgeRange').value : '';
    const heightRange = document.getElementById('adminFilterHeightRange') ? document.getElementById('adminFilterHeightRange').value : '';
    const weightRange = document.getElementById('adminFilterWeightRange') ? document.getElementById('adminFilterWeightRange').value : '';
    const education = document.getElementById('adminFilterEducation') ? document.getElementById('adminFilterEducation').value : '';
    const statusFilter = document.getElementById('adminFilterStatus') ? document.getElementById('adminFilterStatus').value : '';
    const keyword = document.getElementById('adminSearchInput') ? document.getElementById('adminSearchInput').value : '';
    
    let url = apiUrl('/api/data?include_pending=true');
    const params = [];
    if (region) params.push(`region=${encodeURIComponent(region)}`);
    if (ageRange) params.push(`age_range=${encodeURIComponent(ageRange)}`);
    if (heightRange) params.push(`height_range=${encodeURIComponent(heightRange)}`);
    if (weightRange) params.push(`weight_range=${encodeURIComponent(weightRange)}`);
    if (education) params.push(`education=${encodeURIComponent(education)}`);
    if (statusFilter) params.push(`status=${encodeURIComponent(statusFilter)}`);
    if (keyword) params.push(`keyword=${encodeURIComponent(keyword)}`);
    if (params.length) url += '&' + params.join('&');
    
    fetch(url)
        .then(r => r.json())
        .then(res => {
            if (!res.success) {
                document.getElementById('adminDataTable').innerHTML = '<p class="error-message">加载失败：' + res.message + '</p>';
                return;
            }
            
            const data = res.data;
            if (data.length === 0) {
                document.getElementById('adminDataTable').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">暂无数据</p>';
                return;
            }
            
            renderAdminTable(data);
        });
}

// ===== 加载统计数据 =====
function animateCount(el, target) {
    let start = 0;
    const duration = 1200;
    const step = Math.ceil(target / (duration / 16));
    const timer = setInterval(() => {
        start = Math.min(start + step, target);
        el.textContent = start.toLocaleString();
        if (start >= target) clearInterval(timer);
    }, 16);
}

function loadStats() {
    if (CONFIG.STATIC_MODE) {
        // 静态模式：直接读 data.json，本地计算统计
        fetch(CONFIG.DATA_URL)
            .then(r => r.json())
            .then(allData => {
                if (!Array.isArray(allData)) return;
                // 只统计已审核或待审核（前端自行过滤）
                const approved = allData.filter(r => (r.status || 'approved') !== 'expired');
                // 性别统计
                const genderStats = {};
                approved.forEach(r => {
                    const g = r.gender || '未知';
                    genderStats[g] = (genderStats[g]||0) + 1;
                });
                // 地区统计
                const regionStats = {};
                approved.forEach(r => {
                    const reg = r.region_group || '其他';
                    regionStats[reg] = (regionStats[reg]||0) + 1;
                });
                // 年龄统计
                const ageMap = {'20-25':0,'26-30':0,'31-35':0,'36-40':0,'40+':0,'未知':0};
                approved.forEach(r => {
                    const a = r.age_normalized;
                    if (!a) { ageMap['未知']++; return; }
                    if (a <= 25) ageMap['20-25']++;
                    else if (a <= 30) ageMap['26-30']++;
                    else if (a <= 35) ageMap['31-35']++;
                    else if (a <= 40) ageMap['36-40']++;
                    else ageMap['40+']++;
                });
                // 学历统计
                const eduStats = {};
                approved.forEach(r => {
                    const e = r.education || '其他/未知';
                    eduStats[e] = (eduStats[e]||0) + 1;
                });
                const s = { total: approved.length, gender: genderStats, region: regionStats, age: ageMap, education: eduStats };
                // 渲染（复用原来逻辑）
                const avgAge = (() => {
                    let total = 0, count = 0;
                    const w = {'20-25':22,'26-30':28,'31-35':33,'36-40':38,'40+':43};
                    Object.entries(s.age).forEach(([k,v]) => { if (w[k]) { total += w[k]*v; count += v; } });
                    return count ? Math.round(total/count) : '--';
                })();
                document.getElementById('statsCards').innerHTML = `
                    <div class="stat-card stat-card-total"><div class="icon">💝</div><div class="num" id="sc-total">0</div><div class="label">总资料数</div></div>
                    <div class="stat-card stat-card-male"><div class="icon">👨</div><div class="num" id="sc-male">0</div><div class="label">男生</div></div>
                    <div class="stat-card stat-card-female"><div class="icon">👩</div><div class="num" id="sc-female">0</div><div class="label">女生</div></div>
                    <div class="stat-card stat-card-region"><div class="icon">📍</div><div class="num" id="sc-region">0</div><div class="label">地区分组</div></div>
                    <div class="stat-card stat-card-avg"><div class="icon">🎂</div><div class="num">${avgAge}</div><div class="label">平均年龄</div></div>
                `;
                animateCount(document.getElementById('sc-total'), s.total);
                animateCount(document.getElementById('sc-male'), s.gender['男']||0);
                animateCount(document.getElementById('sc-female'), s.gender['女']||0);
                animateCount(document.getElementById('sc-region'), Object.keys(s.region).length);
                renderGenderChart(s.gender);
                renderRegionChart(s.region);
                renderAgeChart(s.age);
                renderEduChart(s.education);
                // 扩展统计也本地算
                const maleH = [], femaleH = [];
                const scatterM = [], scatterF = [];
                const zodiacStats = {};
                approved.forEach(r => {
                    if (r.height) {
                        const h = parseInt(r.height);
                        if (r.gender === '男') maleH.push(h);
                        else if (r.gender === '女') femaleH.push(h);
                    }
                    if (r.birth_year) {
                        const by = parseInt(r.birth_year);
                        if (by) {
                            const z = (by - 4) % 12;
                            const names = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
                            zodiacStats[names[z]] = (zodiacStats[names[z]]||0) + 1;
                        }
                    }
                    if (r.age_normalized && r.height) {
                        const pt = [r.age_normalized, parseInt(r.height)];
                        if (r.gender === '男') scatterM.push(pt);
                        else if (r.gender === '女') scatterF.push(pt);
                    }
                });
                renderZodiacChart(zodiacStats);
                renderHeightChart(maleH, femaleH);
                renderScatterChart(scatterM, scatterF);
            });
        return;
    }
    // 非静态模式：走 API
    fetch(apiUrl('/api/stats'))
        .then(r => r.json())
        .then(res => {
            if (!res.success) return;
            const s = res.stats;
            const avgAge = (() => {
                let total = 0, count = 0;
                const w = {'20-25': 22, '26-30': 28, '31-35': 33, '36-40': 38, '40+': 43};
                Object.entries(s.age).forEach(([k, v]) => { if (w[k]) { total += w[k]*v; count += v; }});
                return count ? Math.round(total/count) : '--';
            })();
            document.getElementById('statsCards').innerHTML = `
                <div class="stat-card stat-card-total"><div class="icon">💝</div><div class="num" id="sc-total">0</div><div class="label">总资料数</div></div>
                <div class="stat-card stat-card-male"><div class="icon">👨</div><div class="num" id="sc-male">0</div><div class="label">男生</div></div>
                <div class="stat-card stat-card-female"><div class="icon">👩</div><div class="num" id="sc-female">0</div><div class="label">女生</div></div>
                <div class="stat-card stat-card-region"><div class="icon">📍</div><div class="num" id="sc-region">0</div><div class="label">地区分组</div></div>
                <div class="stat-card stat-card-avg"><div class="icon">🎂</div><div class="num">${avgAge}</div><div class="label">平均年龄</div></div>
            `;
            animateCount(document.getElementById('sc-total'), s.total);
            animateCount(document.getElementById('sc-male'), s.gender.男||0);
            animateCount(document.getElementById('sc-female'), s.gender.女||0);
            animateCount(document.getElementById('sc-region'), Object.keys(s.region).length);
            renderGenderChart(s.gender);
            renderRegionChart(s.region);
            renderAgeChart(s.age);
            renderEduChart(s.education);
        });

    fetch(apiUrl('/api/stats/extended'))
        .then(r => r.json())
        .then(res => {
            if (!res.success) return;
            renderZodiacChart(res.zodiac);
            renderHeightChart(res.height_male, res.height_female);
            renderScatterChart(res.scatter_male, res.scatter_female);
        });
}

// ===== 图表初始化 =====
let chartGender, chartRegion, chartAge, chartEdu, chartZodiac, chartHeight, chartScatter;
function initCharts() {
    chartGender  = echarts.init(document.getElementById('chartGender'));
    chartRegion  = echarts.init(document.getElementById('chartRegion'));
    chartAge     = echarts.init(document.getElementById('chartAge'));
    chartEdu     = echarts.init(document.getElementById('chartEdu'));
    chartZodiac  = echarts.init(document.getElementById('chartZodiac'));
    chartHeight  = echarts.init(document.getElementById('chartHeight'));
    chartScatter = echarts.init(document.getElementById('chartScatter'));

    chartGender.on('click', params => {
        if (params.name === '未知') return;
        pendingFilter = { gender: params.name === '男生' ? '男' : '女' };
        showTab('data');
    });
    chartRegion.on('click', params => { pendingFilter = { region: params.name }; showTab('data'); });
    chartAge.on('click', params => {
        let ageVal = params.name.replace(/^年龄/, '').replace(/岁$/, '');
        pendingFilter = { ageRange: ageVal }; showTab('data');
    });
    chartEdu.on('click', params => { pendingFilter = { education: params.name }; showTab('data'); });
}

function renderGenderChart(data) {
    const unknown = (data['未知'] || 0);
    const total = (data.男||0) + (data.女||0) + unknown;
    const pieData = [
        { value: data.男||0, name: '男生', itemStyle: { color: UI_COLORS.male } },
        { value: data.女||0, name: '女生', itemStyle: { color: UI_COLORS.female } }
    ];
    if (unknown > 0) {
        pieData.push({ value: unknown, name: '未知', itemStyle: { color: UI_COLORS.muted } });
    }
    chartGender.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c}人 ({d}%)' },
        legend: { bottom: 0 },
        series: [{
            type: 'pie', radius: ['45%', '72%'],
            avoidLabelOverlap: false,
            label: { show: true, position: 'center', formatter: () => `总计\n${total}人`, fontSize: 16, fontWeight: 'bold', color: UI_COLORS.text },
            emphasis: { label: { show: true, fontSize: 18 } },
            data: pieData,
            itemStyle: { borderRadius: 8, borderColor: UI_COLORS.surface, borderWidth: 3 }
        }]
    });
}

function renderHeightChart(maleData, femaleData) {
    const buckets = ['<160','160-164','165-169','170-174','175-179','180-184','185+'];
    chartHeight.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
            formatter: p => p.map(s => `${s.marker}${s.seriesName}: ${Math.abs(s.value)}人`).join('<br>') },
        legend: { data: ['男生','女生'], top: 5 },
        grid: { left: 70, right: 40, top: 40, bottom: 20 },
        xAxis: {
            type: 'value',
            axisLabel: { formatter: v => Math.abs(v) },
            splitLine: { lineStyle: { type: 'dashed', color: UI_COLORS.grid } }
        },
        yAxis: { type: 'category', data: buckets, axisLabel: { color: UI_COLORS.muted, fontSize: 12 } },
        series: [
            {
                name: '男生', type: 'bar', stack: 'total',
                data: buckets.map(b => -(maleData[b]||0)),
                itemStyle: { color: UI_COLORS.male, opacity: 0.88, borderRadius: [4,0,0,4] },
                label: { show: true, formatter: p => p.value === 0 ? '' : Math.abs(p.value), color: UI_COLORS.surface, fontSize: 11 }
            },
            {
                name: '女生', type: 'bar', stack: 'total',
                data: buckets.map(b => femaleData[b]||0),
                itemStyle: { color: UI_COLORS.female, opacity: 0.88, borderRadius: [0,4,4,0] },
                label: { show: true, formatter: p => p.value === 0 ? '' : p.value, color: UI_COLORS.surface, fontSize: 11 }
            }
        ]
    });

    // 点击身高跳转到资料管理
    chartHeight.off('click');
    chartHeight.on('click', function(params) {
        const buckets = ['<160','160-164','165-169','170-174','175-179','180-184','185+'];
        const bucket = buckets[params.dataIndex];
        if (!bucket) return;
        let min=0, max=999;
        if (bucket.startsWith('<')) {
            max = parseInt(bucket.substring(1)) - 1;
        } else if (bucket.endsWith('+')) {
            min = parseInt(bucket);
        } else {
            const parts = bucket.split('-');
            min = parseInt(parts[0]);
            max = parseInt(parts[1]);
        }
        pendingFilter = { heightMin: min, heightMax: max };
        showTab('data');
    });
}

// ===== 加载地区选项 =====
function loadRegionOptions() {
    // 资料管理筛选下拉框的选项顺序（与数据看板图表顺序一致）
    const regionOrder = ['扬中男', '扬中女', '镇江男', '镇江女', '南京', '常州', '苏州', '上海', '无锡杭州北京', '扬中男再婚', '扬中女再婚', '镇江男再婚', '镇江女再婚', '其他'];
    fetch(apiUrl('/api/region-groups')).then(r=>r.json()).then(res=>{
        if(!res.success) return;
        const sel1 = document.getElementById('filterRegion');
        const sel2 = document.getElementById('formRegion');
        sel1.innerHTML = '<option value="">全部地区</option>';
        sel2.innerHTML = '';
        // 按指定顺序排序后添加
        const sorted = [...res.groups].sort((a, b) => {
            const ia = regionOrder.indexOf(a);
            const ib = regionOrder.indexOf(b);
            if (ia === -1) return ib === -1 ? 0 : 1;
            if (ib === -1) return -1;
            return ia - ib;
        });
        sorted.forEach(g => {
            sel1.add(new Option(g, g));
            sel2.add(new Option(g, g));
        });
    });
}

// ===== 加载数据 =====
function loadData() {
    const region = document.getElementById('filterRegion').value;
    const gender = document.getElementById('filterGender').value;
    const zodiac = document.getElementById('filterZodiac') ? document.getElementById('filterZodiac').value : '';
    const education = document.getElementById('filterEducation') ? document.getElementById('filterEducation').value : '';
    const ageRange = document.getElementById('filterAgeRange') ? document.getElementById('filterAgeRange').value : '';
    const heightRange = document.getElementById('filterHeightRange') ? document.getElementById('filterHeightRange').value : '';
    const heightMin = document.getElementById('filterHeightMin') ? document.getElementById('filterHeightMin').value : '';
    const heightMax = document.getElementById('filterHeightMax') ? document.getElementById('filterHeightMax').value : '';
    const weightRange = document.getElementById('filterWeightRange') ? document.getElementById('filterWeightRange').value : '';
    const statusFilter = document.getElementById('filterStatus') ? document.getElementById('filterStatus').value : '';
    const keyword = document.getElementById('searchInput').value;

    if (CONFIG.STATIC_MODE) {
        // 静态模式：读 data.json 本地过滤
        fetch(CONFIG.DATA_URL)
            .then(r => r.json())
            .then(allRecords => {
                if (!Array.isArray(allRecords)) return;
                let filtered = allRecords.filter(r => (r.status || 'approved') !== 'expired');
                if (region) filtered = filtered.filter(r => r.region_group === region);
                if (gender) filtered = filtered.filter(r => r.gender === gender);
                if (zodiac) filtered = filtered.filter(r => r.zodiac === zodiac);
                if (education) filtered = filtered.filter(r => r.education === education);
                if (ageRange) filtered = filtered.filter(r => {
                    const a = r.age_normalized;
                    if (!a) return ageRange === '未知';
                    if (ageRange === '20-25') return a >= 20 && a <= 25;
                    if (ageRange === '26-30') return a >= 26 && a <= 30;
                    if (ageRange === '31-35') return a >= 31 && a <= 35;
                    if (ageRange === '36-40') return a >= 36 && a <= 40;
                    if (ageRange === '40+') return a >= 40;
                    return true;
                });
                if (heightRange) filtered = filtered.filter(r => {
                    const h = parseInt(r.height);
                    if (!h) return heightRange === '未知';
                    if (heightRange === '<150') return h < 150;
                    if (heightRange === '150-159') return h >= 150 && h <= 159;
                    if (heightRange === '160-169') return h >= 160 && h <= 169;
                    if (heightRange === '170-179') return h >= 170 && h <= 179;
                    if (heightRange === '180+') return h >= 180;
                    return true;
                });
                if (weightRange) filtered = filtered.filter(r => {
                    const w = parseInt(r.weight);
                    if (!w) return weightRange === '未知';
                    if (weightRange === '<100') return w < 100;
                    if (weightRange === '100-119') return w >= 100 && w <= 119;
                    if (weightRange === '120-139') return w >= 120 && w <= 139;
                    if (weightRange === '140-159') return w >= 140 && w <= 159;
                    if (weightRange === '160-179') return w >= 160 && w <= 179;
                    if (weightRange === '180+') return w >= 180;
                    return true;
                });
                if (statusFilter) filtered = filtered.filter(r => (r.status || 'approved') === statusFilter);
                if (keyword) {
                    const kw = keyword.toLowerCase();
                    filtered = filtered.filter(r =>
                        (r.family_info||'').toLowerCase().includes(kw) ||
                        (r.mate_requirement||'').toLowerCase().includes(kw) ||
                        (r.job||'').toLowerCase().includes(kw) ||
                        (r.education||'').toLowerCase().includes(kw)
                    );
                }
                allData = filtered;
                currentPage = 1;
                if (viewMode === 'card') renderCards();
                else renderTable();
            });
        return;
    }
    // 非静态模式：走 API
    let url = '/api/data?';
    const params = [];
    if (region) params.push(`region=${encodeURIComponent(region)}`);
    if (gender) params.push(`gender=${encodeURIComponent(gender)}`);
    if (zodiac) params.push(`zodiac=${encodeURIComponent(zodiac)}`);
    if (education) params.push(`education=${encodeURIComponent(education)}`);
    if (ageRange) params.push(`age_range=${encodeURIComponent(ageRange)}`);
    if (heightRange) params.push(`height_range=${encodeURIComponent(heightRange)}`);
    if (heightMin) params.push(`height_min=${heightMin}`);
    if (heightMax) params.push(`height_max=${heightMax}`);
    if (weightRange) params.push(`weight_range=${encodeURIComponent(weightRange)}`);
    if (statusFilter) params.push(`status=${encodeURIComponent(statusFilter)}`);
    if (keyword) params.push(`keyword=${encodeURIComponent(keyword)}`);
    url += params.join('&');
    fetch(apiUrl(url)).then(r=>r.json()).then(res=>{
        if(!res.success) return;
        allData = res.data;
        currentPage = 1;
        if (viewMode === 'card') renderCards();
        else renderTable();
    });
}

let viewMode = 'card';
function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('viewCard').style.display  = mode === 'card'  ? 'block' : 'none';
    document.getElementById('viewTable').style.display = mode === 'table' ? 'block' : 'none';
    document.getElementById('btnCardView').className  = mode === 'card'  ? 'active' : '';
    document.getElementById('btnTableView').className = mode === 'table' ? 'active' : '';
    if (mode === 'card')  renderCards();
    if (mode === 'table') renderTable();
}

// ===== 属相 Emoji =====
const ZODIAC_EMOJI = {'鼠':'🐭','牛':'🐮','虎':'🐯','兔':'🐰','龙':'🐲','蛇':'🐍','马':'🐴','羊':'🐑','猴':'🐵','鸡':'🐔','狗':'🐶','猪':'🐷'};

// 身高百分比（可视化用）
function heightPct(h, gender) {
    const hNum = parseInt(h) || 0;
    if (!hNum) return 0;
    if (gender === '男') return Math.min(100, Math.max(0, Math.round((hNum - 155) / (195 - 155) * 100)));
    if (gender === '女') return Math.min(100, Math.max(0, Math.round((hNum - 148) / (180 - 148) * 100)));
    return Math.min(100, Math.max(0, Math.round((hNum - 150) / 40 * 100)));
}

// ===== 卡片渲染 =====
function renderCards() {
    const start = (currentPage-1)*pageSize;
    const pageData = allData.slice(start, start+pageSize);
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    if (allData.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">没有符合条件的资料</div>';
        document.getElementById('paginationCard').innerHTML = '';
        return;
    }
    pageData.forEach(r => {
        const isMale   = r.gender === '男';
        const isFemale = r.gender === '女';
        const genderKey  = isMale ? 'male' : isFemale ? 'female' : 'other';
        const zodiacIcon = ZODIAC_EMOJI[r.zodiac] || '👤';
        const isSelected = compareList.some(c => c.id === r.id);
        const hPct = heightPct(r.height, r.gender);

        const familyShort = (r.family_info||'').substring(0,32) + ((r.family_info||'').length > 32 ? '…' : '');
        const mateShort   = (r.mate_requirement||'').substring(0,32) + ((r.mate_requirement||'').length > 32 ? '…' : '');

        let adminBtns = '';
        if (currentAdminInfo) {
            adminBtns = `<button class="btn-edit" onclick="openEditModal(${r.id})">✏️ 编辑</button>
                         <button class="btn-del"  onclick="deleteRecord(${r.id})">🗑️</button>`;
        }

        const heightBar = r.height ? `
            <div class="card-height-bar">
                <div class="card-height-label"><span>📏 身高</span><span>${r.height}cm</span></div>
                <div class="height-track"><div class="height-fill height-fill-${genderKey}" style="width:${hPct}%"></div></div>
            </div>` : '';

        const card = document.createElement('div');
        card.className = 'person-card' + (isSelected ? ' selected' : '');
        card.id = `card-${r.id}`;
        card.innerHTML = `
            <div class="card-top-bar card-top-bar-${genderKey}"></div>
            <div class="card-body">
                <div class="card-header">
                    <div class="card-avatar card-avatar-${genderKey}">${zodiacIcon}</div>
                    <div class="card-meta">
                        <div class="card-id">#${r.id} · ${r.region_group||'未分组'}</div>
                        <div class="card-region">${r.birth_year||'?'}年生 · ${r.age_normalized||'?'}岁</div>
                        <span class="card-gender-badge badge-${genderKey === 'other' ? 'male' : genderKey}">${r.gender||'未知'} · ${r.zodiac||'?'}</span>
                    </div>
                </div>
                ${heightBar}
                <div class="card-stats">
                    ${r.weight ? `<span class="card-chip">⚖️ ${r.weight}kg</span>` : ''}${r.status && r.status !== 'approved' ? `<span class="card-chip status-badge ${r.status === 'pending' ? 'status-pending' : 'status-rejected'}" style="cursor:pointer" onclick="cycleStatus(${r.id}, '${r.status}')">${r.status === 'pending' ? '待审核' : '已过期'}</span>` : ''}
                    ${r.education ? `<span class="card-chip chip-edu">🎓 ${r.education}</span>` : ''}
                    ${r.job ? `<span class="card-chip chip-job" title="${r.job}">💼 ${r.job.substring(0,9)}${r.job.length>9?'…':''}</span>` : ''}
                </div>
                ${familyShort ? `<div class="card-info-row"><strong>家庭：</strong>${familyShort}</div>` : ''}
                ${mateShort   ? `<div class="card-info-row"><strong>要求：</strong>${mateShort}</div>` : ''}
            </div>
            <div class="card-actions">
                <button class="btn-view" onclick="viewRecord(${r.id})">👁 详情</button>
                ${adminBtns}
                <button class="btn-compare ${isSelected?'in-compare':''}" onclick="toggleCompare(${r.id})">${isSelected?'✓ 对比中':'💕 对比'}</button>
            </div>
        `;
        grid.appendChild(card);
    });
    renderPaginationCard();
}

function renderPaginationCard() {
    const totalPages = Math.ceil(allData.length / pageSize);
    const pg = document.getElementById('paginationCard');
    pg.innerHTML = '';
    if (totalPages <= 1) return;
    const addBtn = (text, disabled, cls, onClick) => {
        const btn = document.createElement('button');
        btn.textContent = text; if (cls) btn.className = cls;
        btn.disabled = disabled;
        if (!disabled && onClick) btn.onclick = onClick;
        pg.appendChild(btn);
    };
    addBtn('« 首页', currentPage===1, '', () => { currentPage=1; renderCards(); });
    addBtn('‹ 上页', currentPage===1, '', () => { currentPage--; renderCards(); });
    let s=Math.max(1,currentPage-2), e=Math.min(totalPages,s+4); s=Math.max(1,e-4);
    for (let i=s;i<=e;i++) {
        if (i===currentPage) addBtn(String(i), false, 'active-page', null);
        else addBtn(String(i), false, '', ((p)=>()=>{currentPage=p;renderCards();})(i));
    }
    addBtn('下页 ›', currentPage===totalPages, '', () => { currentPage++; renderCards(); });
    addBtn('末页 »', currentPage===totalPages, '', () => { currentPage=totalPages; renderCards(); });
    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `共 ${allData.length} 条，第 ${currentPage}/${totalPages} 页`;
    pg.appendChild(info);
}

    tbody.innerHTML = '';

        tbody.innerHTML = '<tr><td colspan="13" class="empty-state">没有符合条件的资料</td></tr>';

    pageData.forEach(r => {
        const genderClass = (r.gender === '男') ? 'tag-male' : (r.gender === '女') ? 'tag-female' : '';
        const tr = document.createElement('tr');

            <td>${r.zodiac||''}</td>
            <td>${r.birth_year||''}</td>

function renderPagination() {
    const totalPages = Math.ceil(allData.length / pageSize);
    const pg = document.getElementById('pagination');
    pg.innerHTML = '';
    if (totalPages <= 1) return;

    const addBtn = (text, disabled, cls, onClick) => {
        const btn = document.createElement('button');
        btn.textContent = text;
        if (cls) btn.className = cls;
        btn.disabled = disabled;
        if (!disabled && onClick) btn.onclick = onClick;
        pg.appendChild(btn);
    };

    const addEllipsis = () => {
        const span = document.createElement('span');
        span.className = 'ellipsis';
        span.textContent = '…';
        pg.appendChild(span);
    };

    // 首页 + 上一页
    addBtn('« 首页', currentPage === 1, '', () => { currentPage = 1; renderTable(); });
    addBtn('‹ 上一页', currentPage === 1, '', () => { currentPage--; renderTable(); });

    // 页码：最多显示5页，当前页居中
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(totalPages, start + 4);
    start = Math.max(1, end - 4);

    if (start > 1) {
        addBtn('1', false, '', () => { currentPage = 1; renderTable(); });
        if (start > 2) addEllipsis();
    }
    for (let i = start; i <= end; i++) {
        if (i === currentPage) {
            addBtn(String(i), false, 'active-page', null);
        } else {
            addBtn(String(i), false, '', ((p) => () => { currentPage = p; renderTable(); })(i));
        }
    }
    if (end < totalPages) {
        if (end < totalPages - 1) addEllipsis();
        addBtn(String(totalPages), false, '', () => { currentPage = totalPages; renderTable(); });
    }

    // 下一页 + 末页
    addBtn('下一页 ›', currentPage === totalPages, '', () => { currentPage++; renderTable(); });
    addBtn('末页 »', currentPage === totalPages, '', () => { currentPage = totalPages; renderTable(); });

    // 总条数/页数信息
    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `共 ${allData.length} 条，第 ${currentPage}/${totalPages} 页`;
    pg.appendChild(info);
}

// ===== 评分算法 =====
function scoreRecord(r) {
    // 年龄（25岁100分，每超1岁减3分，最低20）
    const age = r.age_normalized || 30;
    const ageScore = Math.max(20, Math.min(100, 100 - Math.max(0, age - 25) * 3));

    // 身高（男：180=100，女：165=100，分别线性）
    const h = parseInt(r.height) || 0;
    let heightScore = 50;
    if (h) {
        if (r.gender === '男') heightScore = Math.min(100, Math.max(30, (h - 155) / (188 - 155) * 100));
        else if (r.gender === '女') heightScore = Math.min(100, Math.max(30, (h - 150) / (172 - 150) * 100));
        else heightScore = Math.min(100, Math.max(30, (h - 152) / 38 * 100));
    }

    // 学历
    const eduMap = {'博士':100,'博士后':100,'硕士':90,'研究生':85,'本科':75,'大专':60,'专科':55,'高中':40,'中专':35,'初中':20};
    const edu = r.education || '';
    let eduScore = 50;
    for (const [k, v] of Object.entries(eduMap)) {
        if (edu.includes(k)) { eduScore = v; break; }
    }

    // 家庭条件（关键词打分）
    const family = (r.family_info || '').toLowerCase();
    let familyScore = 40;
    if (family.includes('别墅') || family.includes('海归') || family.includes('千万')) familyScore = 100;
    else if (family.includes('公务员') || family.includes('医生') || family.includes('教师')) familyScore = 85;
    else if (family.includes('有房') && family.includes('有车')) familyScore = 80;
    else if (family.includes('有房') || family.includes('自建')) familyScore = 70;
    else if (family.includes('w') || family.includes('万')) {
        const m = family.match(/(\d+)[w万]/);
        if (m) {
            const amt = parseInt(m[1]);
            familyScore = amt >= 50 ? 95 : amt >= 20 ? 85 : amt >= 10 ? 75 : 65;
        } else familyScore = 65;
    }

    // 资料完整度
    const fields = [r.age_normalized, r.height, r.weight, r.education, r.job, r.family_info, r.mate_requirement];
    const filled = fields.filter(v => v && String(v).trim()).length;
    const completeness = Math.round(filled / fields.length * 100);

    return {
        age:        Math.round(ageScore),
        height:     Math.round(heightScore),
        education:  Math.round(eduScore),
        family:     Math.round(familyScore),
        completeness: Math.round(completeness),
        raw: { ageScore, heightScore, eduScore, familyScore, completeness }
    };
}

                return;
            }
            
            const expired = res.data;
            if (expired.length === 0) {
                document.getElementById('expiredList').innerHTML = '<p class="empty-state">暂无过期资料</p>';
                return;
            }
            
            let html = '<p class="expired-warning">⚠️ 共有 ' + expired.length + ' 条资料已超过1年，请及时处理：</p>';
            html += '<div class="admin-table-wrap"><table><thead><tr>';
            html += '<th>ID</th><th>地区</th><th>性别</th><th>年龄</th><th>上传日期</th><th>操作</th>';
            html += '</tr></thead><tbody>';
            
            expired.forEach(r => {
                const uploadDate = r.upload_date || '-';
                html += '<tr>';
                html += '<td>' + r.id + '</td>';
                html += '<td>' + (r.region_group || '-') + '</td>';
                html += '<td>' + (r.gender || '-') + '</td>';
                html += '<td>' + (r.age_normalized || '-') + '</td>';
                html += '<td>' + uploadDate + '</td>';
                html += '<td>';
                html += '<button class="action-btn btn-success" onclick="renewRecord(' + r.id + ')">🔄 重新上架</button> ';
                html += '<button class="action-btn btn-del" onclick="deleteExpiredRecord(' + r.id + ')">🗑️ 删除</button>';
                html += '</td>';
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            document.getElementById('expiredList').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('expiredList').innerHTML = '<p class="error-message">加载失败</p>';
            console.error('加载过期资料列表失败:', err);
        });
}

function renewRecord(id) {
    if (!confirm('确定要重新上架这条资料吗？\n（上传日期将更新为今天，有效期延长1年）')) return;
    
    fetch(apiUrl('/api/admin/renew'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id})
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            alert('重新上架成功！');
            loadExpiredList();
            loadExpiredCount();
            loadStats();
        } else {
            alert('操作失败：' + res.message);
        }
    })
    .catch(err => {
        alert('操作失败，请检查网络');
        console.error('重新上架失败:', err);
    });
}

function deleteExpiredRecord(id) {
    if (!confirm('确定要删除这条过期资料吗？\n此操作不可恢复！')) return;
    
    fetch(apiUrl('/api/admin/delete-expired'), {
        method: 'POST',
        headers: getAuthHeader(),
        body: JSON.stringify({id: id})
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            alert('删除成功！');
            loadExpiredList();
            loadExpiredCount();
            loadStats();
        } else {
            alert('操作失败：' + res.message);
        }
    })
    .catch(err => {
        alert('操作失败，请检查网络');
        console.error('删除过期资料失败:', err);
    });
}

// 页面加载时也检查过期资料数量（如果已登录）
function checkExpiredOnLoad() {
    if (CONFIG.STATIC_MODE) return;  // 静态模式不检查
    const token = localStorage.getItem(CONFIG.TOKEN_KEY || 'xiniang_admin_token');
    if (!token) return;  // 未登录不检查
    fetch(apiUrl('/api/admin/current'), { headers: getAuthHeader() })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                loadExpiredCount();
            }
        })
        .catch(err => console.log('未登录或检查过期资料失败'));
}

// 在页面加载完成后检查
window.addEventListener('load', function() {
    setTimeout(checkExpiredOnLoad, 1000);
});

</script>
